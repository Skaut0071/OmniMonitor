[workspace]
resolver = "2"
members = [
    "crates/omni-core",
    "crates/omni-db",
    "crates/omni-capture",
    "crates/omni-webrtc",
    "crates/omni-server",
    "crates/omni-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Skaut0071/OmniMonitor"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"

gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"
gstreamer-rtsp-server = "0.23"

webrtc = "0.11"

# `default-features = false`: sqlx's defaults pull in the MySQL and
# Postgres drivers too, which this project has never used (SQLite is
# the only driver - see docs/ARCHITECTURE.md for why) - no reason to
# compile or ship the others. `0.8` (not `0.7`) because RUSTSEC-2024-0363
# (a sqlx wire-protocol decoding bug) is fixed there; even though that
# advisory is specifically in the MySQL/Postgres decoders this project
# doesn't compile, `cargo audit` flags it by crate version regardless of
# which features are active, so staying on a version with a real fix is
# both the correct and the simplest resolution.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "macros"] }

v4l = "0.14"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
url = "2"

omni-core = { path = "crates/omni-core" }
omni-db = { path = "crates/omni-db" }
omni-capture = { path = "crates/omni-capture" }
omni-webrtc = { path = "crates/omni-webrtc" }

[profile.release]
opt-level = 3
lto = "thin"
