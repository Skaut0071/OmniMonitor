name: Release

# Triggers on pushing a version tag (e.g. `git tag v0.8.1 && git push
# origin v0.8.1`) - builds the release binary + frontend, packages them
# with the systemd unit and install scripts into a tarball laid out the
# same way as this repo (target/release/omni-server, frontend/dist,
# packaging/, scripts/), so `tar xzf ... && cd ... && sudo
# ./scripts/install.sh` works exactly like it does from a git checkout
# with no path changes needed - then publishes it as a GitHub Release
# with that tarball attached.

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libv4l-dev clang cmake \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build omni-wasm
        run: ./scripts/build-wasm.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build release binary
        run: cargo build --release --bin omni-server

      - name: Package tarball
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          STAGE="omnimonitor-${VERSION}-x86_64-linux"
          mkdir -p "$STAGE/target/release" "$STAGE/frontend" "$STAGE/scripts" "$STAGE/packaging"
          cp target/release/omni-server "$STAGE/target/release/omni-server"
          cp -r frontend/dist "$STAGE/frontend/dist"
          cp packaging/omnimonitor.service packaging/Caddyfile.example packaging/nginx.conf.example "$STAGE/packaging/"
          cp scripts/install.sh scripts/bootstrap.sh scripts/build-all.sh scripts/build-wasm.sh "$STAGE/scripts/"
          chmod +x "$STAGE"/scripts/*.sh
          cp README.md LICENSE "$STAGE/"
          tar czf "${STAGE}.tar.gz" "$STAGE"
          echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        run: |
          gh release create "${GITHUB_REF_NAME}" "${ASSET}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
