name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libv4l-dev clang cmake \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --workspace
        run: cargo build --workspace --all-targets

      - name: cargo clippy --workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build omni-wasm
        run: ./scripts/build-wasm.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npm run check

      - name: npm run build
        working-directory: frontend
        run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Checks Cargo.lock against the RustSec advisory database for
      # known-vulnerable dependency versions - doesn't need the project
      # itself to build (it only reads Cargo.lock), so it's a separate,
      # fast job rather than a step tacked onto `backend`.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2023-0071 (rsa crate, timing sidechannel, no fixed
          # version exists upstream) only reaches this project via
          # sqlx-mysql - an optional sqlx driver this project never
          # activates (sqlx is configured with default-features = false
          # and only the "sqlite" driver enabled, see Cargo.toml) and
          # confirmed not present in any built binary. It's still listed
          # in Cargo.lock because Cargo.lock records the whole possible
          # dependency graph, not just what's feature-activated for this
          # build - a known limitation of lockfile-based scanning, not a
          # real exposure here. Ignored explicitly rather than left to
          # perpetually fail CI on an advisory with no available fix.
          ignore: RUSTSEC-2023-0071
